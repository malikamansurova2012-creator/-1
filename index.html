
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Forgotten Kingdom</title>

<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111820;
  font-family: Georgia, serif;
  color: #f2e9d4;
  touch-action: none;
}
canvas { display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.panel {
  background: linear-gradient(135deg, rgba(17,26,35,.91), rgba(36,39,43,.83));
  border: 1px solid rgba(207,174,112,.5);
  box-shadow: 0 5px 25px #0008;
  border-radius: 9px;
  padding: 10px 13px;
}
#title {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  text-align:center; letter-spacing:3px; font-size:14px;
  color:#e9d4a6; white-space:nowrap;
}
#status { position:absolute; top:12px; left:12px; font-size:12px; }
#mapButton {
  position:absolute; top:12px; right:12px; pointer-events:auto;
  border:1px solid #c9a76b; background:#17222cdd; color:#f0dfba;
  border-radius:8px; padding:10px 14px; font-family:Georgia;
}
#hint {
  position:absolute; bottom:22%; left:50%; transform:translateX(-50%);
  text-align:center; min-width:210px; max-width:85%;
  font-size:14px; color:#f1dfb9; display:none;
}
#message {
  position:absolute; top:17%; left:50%; transform:translateX(-50%);
  max-width:85%; text-align:center; font-size:15px;
  color:#f3dfb4; display:none;
}
#crosshair {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:5px; height:5px; border:1px solid #eee9; border-radius:50%;
}
#controls { position:absolute; inset:0; }
#stick {
  position:absolute; left:25px; bottom:28px; width:112px; height:112px;
  border:1px solid #d3bd8a88; border-radius:50%;
  background:#18232a88; pointer-events:auto;
}
#nub {
  position:absolute; width:43px; height:43px; border-radius:50%;
  background:#c7ad7b99; border:1px solid #e7d6ae;
  left:34px; top:34px;
}
.action {
  position:absolute; right:22px; bottom:34px; pointer-events:auto;
  width:65px; height:65px; border-radius:50%;
  border:1px solid #d6bd83; background:#24323bd9;
  color:#f3dfb4; font-size:12px; font-family:Georgia;
}
#jump { right:99px; bottom:105px; width:52px; height:52px; }
#run { right:27px; bottom:111px; width:52px; height:52px; }
#mapScreen {
  position:absolute; inset:6%; display:none; pointer-events:auto;
  background:#111c23f5; border:1px solid #c7a56d;
  border-radius:12px; padding:14px; overflow:auto;
}
#mapScreen h2 { text-align:center; font-weight:normal; color:#e6c98e; }
#mapCanvas {
  width:100%; max-width:500px; aspect-ratio:1;
  display:block; margin:10px auto; background:#25333a;
  border:1px solid #7e735b;
}
#closeMap {
  display:block; margin:12px auto; padding:9px 24px;
  background:#34424a; color:#f2dfb8; border:1px solid #b99b66;
  border-radius:7px; font-family:Georgia;
}
#inventory {
  position:absolute; left:12px; bottom:12px; font-size:11px;
  max-width:145px; line-height:1.5;
}
#legend { text-align:center; font-size:12px; color:#c9bea6; }
@media (hover:hover) and (pointer:fine) {
  #controls { display:none; }
}
</style>
</head>

<body>
<div id="ui">
  <div id="title">THE FORGOTTEN KINGDOM</div>
  <div id="status" class="panel">День I · Исследование</div>
  <button id="mapButton">КАРТА</button>
  <div id="crosshair"></div>
  <div id="hint" class="panel"></div>
  <div id="message" class="panel"></div>
  <div id="inventory" class="panel">Инвентарь: пусто</div>

  <div id="controls">
    <div id="stick"><div id="nub"></div></div>
    <button id="jump" class="action">ПРЫЖОК</button>
    <button id="run" class="action">БЕГ</button>
    <button id="interact" class="action">ДЕЙСТВИЕ</button>
  </div>

  <div id="mapScreen" class="panel">
    <h2>КАРТА КОРОЛЕВСТВА</h2>
    <canvas id="mapCanvas" width="500" height="500"></canvas>
    <div id="legend">Неизведанное · Исследованное · Ваша позиция</div>
    <button id="closeMap">ЗАКРЫТЬ</button>
  </div>
</div>

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x9eafba, 0.0035);

const camera = new THREE.PerspectiveCamera(

const renderer = new THREE.WebGLRenderer({

  powerPreference: "high-performance"
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const mats = {};
function material(name, color, roughness=0.85, metalness=0) {
  mats[name] = new THREE.MeshStandardMaterial({
    color, roughness, metalness
  });
  return mats[name];
}

function box(x,y,z,w,h,d,mat,solid=false, parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), mat
  );
  mesh.position.set(x,y+h/2,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  if (solid) colliders.push({x,z,w,d});
  return mesh;
}

function sphere(x,y,z,r,mat,parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(r,16,12), mat
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(x,y,z,r1,r2,h,mat,parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,h,12),mat
  );
  mesh.position.set(x,y+h/2,z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function ground(x,z,w,d,mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,0.3,d), mat
  );
  mesh.position.set(x,-0.16,z);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function wall(x,z,w,d,h=4,mat=mats.stone) {
  return box(x,h/2,z,w,h,d,mat,true);
}

/* =========================
   ОСВЕЩЕНИЕ
========================= */

scene.add(new THREE.HemisphereLight(0xc5d9e6,0x4c4030,1.3));

const sun = new THREE.DirectionalLight(0xffe2b1,2.0);
sun.position.set(-45,65,35);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -90;
scene.add(sun);

function torch(x,y,z) {
  const holder = new THREE.Group();
  holder.position.set(x,y,z);
  scene.add(holder);

  cylinder(0,0,0,0.07,0.09,0.5,mats.iron,holder);
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.105,0.35,8),
    new THREE.MeshBasicMaterial({color:0xffb13b})
  );
  flame.position.y=0.55;
  holder.add(flame);

  const light = new THREE.PointLight(0xffa94d,2.2,9,2);
  light.position.set(0,0.65,0);
  holder.add(light);

  const glow = sphere(0,0.57,0,0.07,
    new THREE.MeshBasicMaterial({color:0xffe0a0}),holder);
  glow.material.transparent=true;
  return {flame,light};
}

/* =========================
   АРХИТЕКТУРА
========================= */

function room(cx,cz,w,d,options={}) {
  const h=options.height || 4.8;
  const thick=0.55;
  const floorMat=options.floor || mats.floor;
  ground(cx,cz,w,d,floorMat);

  const doorWidth=options.doorWidth || 2.3;
  const opening=options.opening || "south";
  const wallMat=options.wall || mats.lightStone;

  wall(cx,cz-d/2,w,thick,h,wallMat);
  wall(cx,cz+d/2,w,thick,h,wallMat);
  wall(cx-w/2,cz,thick,d,h,wallMat);
  wall(cx+w/2,cz,thick,d,h,wallMat);

  // Открытый дверной проём в выбранной стене
  if(opening==="south") {
    wall(cx-w/2+doorWidth/2,cz+d/2,w/2-doorWidth/2,thick,h,wallMat);
    wall(cx+doorWidth/2,cz+d/2,w/2-doorWidth/2,thick,h,wallMat);
  }
  return {cx,cz,w,d};
}

function doorway(x,z,width=2.4,height=3.1) {
  // Декоративная каменная арка
  box(x-width/2-0.12,0.1,z,0.24,height,0.4,mats.darkStone);
  box(x+width/2+0.12,0.1,z,0.24,height,0.4,mats.darkStone);
  box(x,height,z,width+0.5,0.35,0.55,mats.darkStone);
}

function column(x,z,h=4) {
  cylinder(x,h/2,z,0.32,0.38,h,mats.lightStone);
  cylinder(x,h-0.12,z,0.48,0.48,0.24,mats.gold);
  cylinder(x,0.05,z,0.48,0.48,0.2,mats.darkStone);
}

function arch(x,z,width=3,height=4) {
  column(x-width/2,z,height);
  column(x+width/2,z,height);
  const curve = new THREE.Mesh(
    new THREE.TorusGeometry(width/2,height*0.11,8,24,Math.PI),
    mats.lightStone
  );
  curve.position.set(x,height,z);
  curve.rotation.z=Math.PI;
  scene.add(curve);
}

function banner(x,y,z,color=0x8b2637) {
  const pole=cylinder(x,y,z,0.035,0.035,2.7,mats.gold);
  const cloth=new THREE.Mesh(
    new THREE.PlaneGeometry(0.9,1.5),
    new THREE.MeshStandardMaterial({
      color,side:THREE.DoubleSide,roughness:0.9
    })
  );
  cloth.position.set(x+0.48,y-0.7,z);
  cloth.rotation.y=Math.PI/2;
  scene.add(cloth);
}

function house(x,z,color=0x76504a) {
  const group=new THREE.Group();
  scene.add(group);
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(7,4.2,6),
    new THREE.MeshStandardMaterial({color:0xc0ae91})
  );
  body.position.set(x,2.1,z);
  body.castShadow=true;
  group.add(body);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(5.3,3.2,4),
    new THREE.MeshStandardMaterial({color})
  );
  roof.position.set(x,5.5,z);
  roof.rotation.y=Math.PI/4;
  roof.castShadow=true;
  group.add(roof);

  const door=box(x,0.1,z-3.05,1.3,2.5,0.2,mats.darkWood);
  colliders.push({x,z,w:7,d:6});
  return group;
}

  cylinder(x,scale*1.4,z,0.25*scale,0.42*scale,2.8*scale,mats.wood);

  );
  crown2.position.set(x,6*scale,z);
  scene.add(crown2);
  colliders.push({x,z,w:0.8*scale,d:0.8*scale});
}

function addInteractable(x,y,z,name,description,action) {
  const marker=new THREE.Group();
  marker.position.set(x,y,z);
  scene.add(marker);

  const gem=new THREE.Mesh(
    new THREE.OctahedronGeometry(0.32),
    new THREE.MeshStandardMaterial({
      color:0xc8a65d,
      emissive:0x604018,
      metalness:0.65,
      roughness:0.2
    })
  );
  marker.add(gem);

  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(0.48,0.025,8,24),
    mats.gold
  );
  ring.rotation.x=Math.PI/2;
  marker.add(ring);

  interactables.push({
    group:marker, name, description, action, gem
  });
}

addInteractable(
  -22,1.5,-4,
  "Старая книга",
  "На обложке почти стёрт герб королевской семьи.",
  ()=>{
    if(!inventory.includes("Запись из библиотеки")) {
      inventory.push("Запись из библиотеки");

      say("Ты нашла старую запись. На полях нарисованы три символа.");
    } else say("Ты уже забрала эту запись.");
  }
);

addInteractable(
  0,1.5,-10,
  "Королевская печать",
  "Металл холодный, хотя в зале тепло.",
  ()=>{
    if(!inventory.includes("Королевская печать")) {
      inventory.push("Королевская печать");
      updateInventory();
      say("Получен предмет: Королевская печать.");
    }
  }
);

addInteractable(
  65,1.3,155,
  "Рунический круг",
  "Три символа. Кажется, они должны быть активированы в определённом порядке.",
  ()=>{
    if(!inventory.includes("Запись из библиотеки")) {
      say("Символы слишком древние. Возможно, в замке есть подсказка.");
      return;
    }
    runeProgress++;
    if(runeProgress>=3 && !puzzleSolved) {
      puzzleSolved=true;
      inventory.push("Осколок древнего ключа");
      updateInventory();
      say("Рунический круг вспыхнул. Камень под ногами сдвинулся.");
      runeRing.material=new THREE.MeshStandardMaterial({
        color:0x6cc8d1,emissive:0x286b75
      });
    } else {
      say(["Первый символ отозвался тихим звоном.",
        "Второй символ загорелся.",
        "Что-то глубоко под землёй пришло в движение."][runeProgress-1]);
    }
  }
);

function updateInventory() {
  ui.inventory.innerHTML="ИНВЕНТАРЬ<br>"+
    (inventory.length ? inventory.map(x=>"• "+x).join("<br>") : "Пусто");
}

function say(text) {
  ui.message.textContent=text;
  ui.message.style.display="block";
  messageTimer=4;
}

/* =========================
   ДВИЖЕНИЕ И КОЛЛИЗИИ
========================= */

function collides(x,z) {
  for(const c of colliders) {
    if(
      Math.abs(x-c.x)<c.w/2+player.radius &&
      Math.abs(z-c.z)<c.d/2+player.radius
    ) return true;
  }
  return false;
}

function movePlayer(dx,dz) {
  const nx=player.x+dx;
  const nz=player.z+dz;

  if(!collides(nx,player.z)) player.x=nx;
  if(!collides(player.x,nz)) player.z=nz;
}

const keys={};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==="e" || e.key==="Enter") interact();
  if(e.key===" " && grounded) jumpVelocity=6;
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function interact() {
  if(nearbyObject) nearbyObject.action();
}

/* =========================
   КАМЕРА И МОБИЛЬНОЕ УПРАВЛЕНИЕ
========================= */

let moveX=0,moveY=0;
let lookPointer=null;
let lastLookX=0,lastLookY=0;
let lookSensitivity=0.004;

const stick=document.getElementById("stick");
const nub=document.getElementById("nub");

stick.addEventListener("pointerdown",e=>{
  stick.setPointerCapture(e.pointerId);
  updateStick(e);
});
stick.addEventListener("pointermove",e=>{
  if(e.buttons) updateStick(e);
});
stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

function updateStick(e) {
  const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;
  const len=Math.hypot(dx,dy);
  const max=40;
  if(len>max) { dx=dx/len*max; dy=dy/len*max; }
  nub.style.left=(34+dx)+"px";
  nub.style.top=(34+dy)+"px";
  moveX=dx/max;
  moveY=dy/max;
}
function resetStick() {
  moveX=0;moveY=0;
  nub.style.left="34px";
  nub.style.top="34px";
}

renderer.domElement.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse") {
    renderer.domElement.requestPointerLock?.();
  } else {
    lookPointer=e.pointerId;
    lastLookX=e.clientX;
    lastLookY=e.clientY;
  }
});

renderer.domElement.addEventListener("pointermove",e=>{
  if(document.pointerLockElement===renderer.domElement) {
    yaw-=e.movementX*0.0025;
    pitch-=e.movementY*0.0025;
  } else if(e.pointerId===lookPointer) {
    yaw-=(e.clientX-lastLookX)*lookSensitivity;
    pitch-=(e.clientY-lastLookY)*lookSensitivity;
    lastLookX=e.clientX;
    lastLookY=e.clientY;
  }
});

renderer.domElement.addEventListener("pointerup",e=>{
  if(e.pointerId===lookPointer) lookPointer=null;
});

document.getElementById("jump").addEventListener("pointerdown",()=>{
  if(grounded) jumpVelocity=6;
});
document.getElementById("run").addEventListener("pointerdown",()=>isRunning=true);
document.getElementById("run").addEventListener("pointerup",()=>isRunning=false);
document.getElementById("run").addEventListener("pointercancel",()=>isRunning=false);
document.getElementById("interact").addEventListener("click",interact);

/* =========================
   КАРТА И ИССЛЕДОВАНИЕ
========================= */

const mapCtx=ui.mapCanvas.getContext("2d");
const MAP_SIZE=500;
const WORLD_RANGE=190;
const CELL=5;
const discovered=new Set();

function worldToMap(x,z) {
  return {
    x:(x+WORLD_RANGE)/(WORLD_RANGE*2)*MAP_SIZE,
    y:(z+WORLD_RANGE)/(WORLD_RANGE*2)*MAP_SIZE
  };
}

function reveal() {
  const gx=Math.floor((player.x+WORLD_RANGE)/CELL);
  const gz=Math.floor((player.z+WORLD_RANGE)/CELL);
  for(let x=-3;x<=3;x++) {
    for(let z=-3;z<=3;z++) {
      discovered.add((gx+x)+","+(gz+z));
    }
  }
}

function drawMap() {
  mapCtx.fillStyle="#263b37";
  mapCtx.fillRect(0,0,500,500);

  // Озеро
  const lakePos=worldToMap(38,118);
  mapCtx.fillStyle="#416f82";
  mapCtx.beginPath();
  mapCtx.ellipse(lakePos.x,lakePos.y,22,22,0,0,Math.PI*2);
  mapCtx.fill();

  // Замок
  const castle=worldToMap(0,0);
  mapCtx.fillStyle="#927f68";
  mapCtx.fillRect(castle.x-40,castle.y-35,80,70);

  // Город
  const town=worldToMap(0,54);
  mapCtx.fillStyle="#9a805d";
  mapCtx.fillRect(town.x-40,town.y-22,80,44);

  // Исследованные клетки
  mapCtx.fillStyle="#bba77b";
  for(const cell of discovered) {
    const [gx,gz]=cell.split(",").map(Number);
    const x=(gx*CELL-WORLD_RANGE)/(WORLD_RANGE*2)*500;
    const y=(gz*CELL-WORLD_RANGE)/(WORLD_RANGE*2)*500;
    mapCtx.fillRect(x,y,7,7);
  }

  // Маркер игрока
  const p=worldToMap(player.x,player.z);
  mapCtx.fillStyle="#f4df9c";
  mapCtx.beginPath();
  mapCtx.arc(p.x,p.y,6,0,Math.PI*2);
  mapCtx.fill();
  mapCtx.strokeStyle="#fff";
  mapCtx.lineWidth=2;
  mapCtx.stroke();
}

document.getElementById("mapButton").onclick=()=>{
  mapOpen=true;
  ui.map.style.display="block";
  drawMap();
};
document.getElementById("closeMap").onclick=()=>{
  mapOpen=false;
  ui.map.style.display="none";
};

/* =========================
   СОХРАНЕНИЕ
========================= */

function saveGame() {
  const data={
    x:player.x,z:player.z,
    inventory,
    discovered:[...discovered],
    runeProgress,puzzleSolved
  };
  try {
    localStorage.setItem("forgottenKingdomSave",JSON.stringify(data));
  } catch(e) {}
}

function loadGame() {
  try {
    const raw=localStorage.getItem("forgottenKingdomSave");
    if(!raw) return;
    const data=JSON.parse(raw);
    player.x=data.x ?? 0;
    player.z=data.z ?? 28;
    inventory.push(...(data.inventory||[]));
    (data.discovered||[]).forEach(v=>discovered.add(v));
    runeProgress=data.runeProgress||0;
    puzzleSolved=!!data.puzzleSolved;
    updateInventory();
  } catch(e) {}
}

loadGame();

/* =========================
   ПОГОДА И АТМОСФЕРА
========================= */

const clouds=[];
for(let i=0;i<12;i++) {
  const cloud=new THREE.Group();
  const cloudMat=new THREE.MeshStandardMaterial({
    color:0xe3e5e2,transparent:true,opacity:0.72
  });
  for(let j=0;j<4;j++) {
    const puff=new THREE.Mesh(
      new THREE.SphereGeometry(2.4,10,8),cloudMat
    );
    puff.position.set(j*2.3,Math.random()*0.5,Math.random()*0.6);
    cloud.add(puff);
  }
  cloud.position.set(-90+Math.random()*180,35+Math.random()*15,
    -100+Math.random()*180);
  scene.add(cloud);
  clouds.push(cloud);
}

/* =========================
   ГЛАВНЫЙ ЦИКЛ
========================= */

function update(dt) {
  const forward=(keys.w||keys.arrowup ? 1:0) -
                (keys.s||keys.arrowdown ? 1:0) - moveY;
  const side=(keys.d||keys.arrowright ? 1:0) -
             (keys.a||keys.arrowleft ? 1:0) + moveX;

  const length=Math.hypot(forward,side);
  const speed=(isRunning||keys.shift ? 8:4.2);

  if(length>0.05) {
    const f=forward/Math.max(1,length);
    const s=side/Math.max(1,length);
    const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt;
    const dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt;
    movePlayer(dx,dz);
  }

  if(!grounded) {
    jumpVelocity-=15*dt;
    player.y+=jumpVelocity*dt;
    if(player.y<=1.7) {
      player.y=1.7;
      grounded=true;
      jumpVelocity=0;
    }
  }

  pitch=THREE.MathUtils.clamp(pitch,-1.25,1.25);
  camera.position.set(player.x,player.y,player.z);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  // Поиск ближайшего объекта
  nearbyObject=null;
  let closest=2.8;

  for(const item of interactables) {
    item.group.rotation.y+=dt*0.45;
    item.gem.rotation.x+=dt*0.5;
    const dist=Math.hypot(
      player.x-item.group.position.x,
      player.z-item.group.position.z
    );
    if(dist<closest) {
      closest=dist;
      nearbyObject=item;
    }
  }

  if(nearbyObject) {
    ui.hint.style.display="block";
    ui.hint.innerHTML="<b>"+nearbyObject.name+"</b><br>"+
      nearbyObject.description+"<br><br>Нажми ДЕЙСТВИЕ";
  } else {
    ui.hint.style.display="none";
  }

  reveal();

  if(messageTimer>0) {
    messageTimer-=dt;
    if(messageTimer<=0) ui.message.style.display="none";
  }

  for(const c of clouds) c.position.x+=dt*0.25;
}

let saveTimer=0;
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  update(dt);

  saveTimer+=dt;
  if(saveTimer>8) {
    saveGame();
    saveTimer=0;
  }

  renderer.render(scene,camera);
}
animate();

addEventListener("beforeunload",saveGame);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

reveal();
say("Королевство молчит. Пока что.");
</script>
</body>

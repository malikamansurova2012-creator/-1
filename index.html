<script type="module">
import * as THREE from "three";

/* ===== ОСНОВА ===== */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9aabb7);
scene.fog=new THREE.Fog(0x9aabb7,100,260);

const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.1,500);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
document.body.appendChild(renderer.domElement);

const mats={};
function M(n,c,r=.85,metal=0){
  mats[n]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:metal});
}
M("ground",0x65784d); M("grass",0x75865a); M("stone",0xb7ad99);
M("pale",0xd1c4a8); M("shadowStone",0x60636a); M("floor",0x887b68);
M("wood",0x69462f); M("darkWood",0x38291f); M("gold",0xc6a15b,.32,.55);
M("roof",0x3c4e5c); M("roofRed",0x713d3b); M("blue",0x344d6b);
M("red",0x873e42); M("glass",0x83b3c1,.2,.35); M("water",0x477b91,.18,.25);
M("leaf",0x35553a); M("leaf2",0x647d4d); M("iron",0x515a60,.45,.65);
M("marble",0xd8d0bd,.35); M("sand",0xb7a17d);

scene.add(new THREE.HemisphereLight(0xd5e5f1,0x554331,1.55));
const sun=new THREE.DirectionalLight(0xffe3bd,2.1);
sun.position.set(-55,90,40);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;sun.shadow.camera.right=100;
sun.shadow.camera.top=100;sun.shadow.camera.bottom=-100;
scene.add(sun);

const boxGeo=new THREE.BoxGeometry(1,1,1);
const sphereGeo=new THREE.SphereGeometry(.5,12,10);
const cylGeo=new THREE.CylinderGeometry(.5,.5,1,12);
const colliders=[];
const interactables=[];

const inventory=[];
const player={x:0,y:1.7,z:24};

/* ===== ГЕОМЕТРИЯ ===== */

// ВАЖНО: box использует координату Y как НИЖНЮЮ точку объекта.
function box(x,y,z,w,h,d,material,solid=true){
  const o=new THREE.Mesh(boxGeo,material);
  o.position.set(x,y+h/2,z);
  o.scale.set(w,h,d);
  o.castShadow=true;o.receiveShadow=true;
  scene.add(o);
  if(solid)colliders.push({x,z,w,d});
  return o;
}

function floor(x,z,w,d,material){
  return box(x,-.15,z,w,.3,d,material,false);
}

function cylinder(x,y,z,r,h,material,solid=false){
  const o=new THREE.Mesh(cylGeo,material);
  o.position.set(x,y+h/2,z);
  o.scale.set(r*2,h,r*2);
  o.castShadow=true;o.receiveShadow=true;
  scene.add(o);
  if(solid)colliders.push({x,z,w:r*2,d:r*2});
  return o;
}

function sphere(x,y,z,r,material){
  const o=new THREE.Mesh(sphereGeo,material);
  o.position.set(x,y,z);o.scale.set(r*2,r*2,r*2);
  o.castShadow=true;scene.add(o);return o;
}

function wall(x,z,w,d,h=4.5,material=mats.stone){
  return box(x,0,z,w,h,d,material,true);
}

function wallWithDoor(x,z,length,thickness,height,alongX=true,gap=2.8){
  const part=(length-gap)/2;
  if(alongX){
    wall(x-(gap+part)/2,z,part,thickness,height);
    wall(x+(gap+part)/2,z,part,thickness,height);
    box(x,height-0.45,z,gap,.45,thickness,mats.pale,false);
  }else{
    wall(x,z-(gap+part)/2,thickness,part,height);
    wall(x,z+(gap+part)/2,thickness,part,height);
    box(x,height-.45,z,thickness,.45,gap,mats.pale,false);
  }
}

function torch(x,y,z){
  cylinder(x,y,z,.09,.55,mats.iron);
  const flame=new THREE.Mesh(
    new THREE.ConeGeometry(.13,.34,8),
    new THREE.MeshBasicMaterial({color:0xffa52e})
  );
  flame.position.set(x,y+.73,z);scene.add(flame);
  const light=new THREE.PointLight(0xffa84f,1.8,10);
  light.position.set(x,y+.75,z);scene.add(light);
  return flame;
}

function column(x,z,h=4){
  cylinder(x,0,z,.38,h,mats.pale,true);
  cylinder(x,h-.2,z,.53,.3,mats.gold);
  cylinder(x,0,z,.5,.2,mats.shadowStone);
}

function window(x,y,z){
  box(x,y,z,.13,1.8,.12,mats.iron,false);
  box(x,y,z-.04,.1,1.55,.08,mats.glass,false);
  box(x,y,z,.1,.12,2,mats.gold,false);
}

function banner(x,y,z,color){
  cylinder(x,y,z,.035,2.8,mats.gold);
  box(x+.48,y+1,z,.9,1.5,.08,
    new THREE.MeshStandardMaterial({color,side:THREE.DoubleSide}),false);
}

function roof(x,z,w,d,color=mats.roof){
  const o=new THREE.Mesh(
    new THREE.ConeGeometry(Math.max(w,d)*.72,3,4),
    color
  );
  o.position.set(x,6,z);o.rotation.y=Math.PI/4;
  o.castShadow=true;scene.add(o);
}

/* ===== ПОЛ МИРА: ЕДИНАЯ ПОВЕРХНОСТЬ ===== */

floor(0,0,340,340,mats.ground);
floor(0,24,52,45,mats.sand);
floor(0,67,70,48,mats.sand);
floor(0,115,7,95,mats.sand);

/* ===== ЗАМОК: НЕПРЕРЫВНЫЙ ПЛАН ===== */

// Главный корпус
floor(0,-22,42,40,mats.marble);
wallWithDoor(0,-42,42,.9,9,true,4);
wall(-21,-22,.9,40,9);
wall(21,-22,.9,40,9);
wallWithDoor(0,-2,42,.9,9,true,4);

// Башни по углам
for(const x of [-20,20])for(const z of [-41,-3]){
  cylinder(x,0,z,2.5,9,mats.shadowStone,true);
  cylinder(x,9,z,2.1,2.4,mats.roof);
  cylinder(x,10.7,z,1.8,1.1,mats.gold);
}

// Внутренние стены с настоящими проёмами
wallWithDoor(-10,-22,18,.6,5,false,3);
wallWithDoor(10,-22,18,.6,5,false,3);
wallWithDoor(0,-32,20,.6,5,true,3);
wallWithDoor(-10,-12,18,.6,5,false,3);
wallWithDoor(10,-12,18,.6,5,false,3);

// Тронный зал
floor(0,-35,18,12,mats.marble);
for(const x of [-7,7])for(const z of [-39,-31])column(x,z,5);
box(0,0,-39,5,.5,2,mats.gold,false);
box(0,.5,-39,2.3,1.8,1.2,mats.blue,false);
box(0,2.3,-39,1.6,.5,1,mats.gold,false);
banner(-8,4,-30,0x344c72);
banner(8,4,-30,0x863e43);

// Библиотека слева
for(const x of [-17,-14,-11]){
  box(x,0,-31,2.1,3.5,.6,mats.darkWood,false);
  for(let y=.8;y<3.2;y+=.8){
    box(x,y,-30.65,1.9,.09,.08,mats.gold,false);
    for(let i=0;i<5;i++){
      const colors=[0x853d3b,0x34546e,0xb08b4e,0x425e48];
      box(x-.7+i*.32,y+.18,-30.8,.2,.42,.3,

    }
  }
}

// Спальня справа
box(14,0,-31,5,.5,3,mats.darkWood,false);
box(14,.5,-31,4.7,.3,2.8,mats.blue,false);
box(14,.8,-32.3,4.7,1.8,.25,mats.wood,false);
box(10,0,-25,2,1.2,1.2,mats.wood,false);

// Боковые комнаты
floor(-15,-18,10,9,mats.floor);
floor(15,-18,10,9,mats.floor);
floor(-15,-7,10,9,mats.floor);
floor(15,-7,10,9,mats.floor);
box(-15,0,-18,3,.8,2,mats.wood,false);
box(15,0,-18,3,.8,2,mats.wood,false);

// Декор и свет
for(const p of [
  [-18,2,-37],[-11,2,-37],[11,2,-37],[18,2,-37],
  [-18,2,-9],[18,2,-9],[-8,2,-26],[8,2,-26],
  [-18,2,-16],[18,2,-16]
])torch(...p);

for(const x of [-15,-8,8,15])window(x,3,-42);

// Большой двор
for(const x of [-17,-9,9,17]){
  column(x,0,4);
  column(x,25,4);
}
floor(0,0,42,5,mats.marble);
floor(0,25,42,5,mats.marble);

// Фонтан
cylinder(0,0,7,3.1,.65,mats.pale);
cylinder(0,.65,7,2.7,.12,mats.water);
cylinder(0,.77,7,.5,1.1,mats.gold);
cylinder(0,1.9,7,.9,.12,mats.water);

// Садовые клумбы
for(const side of [-1,1]){
  for(let z=-2;z<=22;z+=6){
    box(side*16,0,z,3,.35,2,mats.wood,false);
    for(let i=0;i<5;i++){
      sphere(side*16-1+i*.5,.65,z,.35,
        new THREE.MeshStandardMaterial({color:[0x9b4653,0xd1b36a,0x7188a0][i%3]}));
    }
  }
}

/* ===== ГОРОД ===== */

function house(x,z,roofColor=0x40566a){
  // Фасад и отдельная крыша
  box(x,0,z,7,4.5,6,mats.pale,true);
  box(x,1,z-3.08,1.35,2.2,.15,mats.darkWood,false);
  box(x-2,2,z-3.12,1.15,1.3,.13,mats.glass,false);
  box(x+2,2,z-3.12,1.15,1.3,.13,mats.glass,false);

  const r=new THREE.Mesh(
    new THREE.ConeGeometry(5.3,3.2,4),
    new THREE.MeshStandardMaterial({color:roofColor,roughness:.9})
  );
  r.position.set(x,6,z);r.rotation.y=Math.PI/4;
  r.castShadow=true;scene.add(r);
}
house(-18,57,0x435a70);
house(18,57,0x77434a);
house(-29,76,0x536b65);
house(29,76,0x8b6246);
house(-13,84,0x59465c);
house(14,84,0x425d6e);

// Уличные фонари
for(const x of [-15,0,15]){

function tree(x,z,s=1){

  );
  crown2.position.set(x,7*s,z);scene.add(crown2);
}

/* ===== ПРЕДМЕТЫ И ЗАГАДКИ ===== */

function addObject(x,y,z,name,description,callback){
  const group=new THREE.Group();
  group.position.set(x,y,z);
  scene.add(group);
  const gem=new THREE.Mesh(
    new THREE.OctahedronGeometry(.35),
    new THREE.MeshStandardMaterial({
      color:0xc6a15b,emissive:0x4b3211,
      metalness:.55,roughness:.25
    })
  );
  group.add(gem);
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.5,.025,8,24),mats.gold
  );
  ring.rotation.x=Math.PI/2;
  group.add(ring);
  interactables.push({group,name,description,callback});
}

addObject(-15,1.3,-31,"Старая запись",
  "На полях нарисованы три символа.",
  ()=>{
    if(inventory.includes("Старая запись"))return say("Ты уже забрала запись.");
    inventory.push("Старая запись");updateInventory();
    say("Ты нашла старую запись из королевской библиотеки.");
  }
);

addObject(0,1.5,-39,"Королевская печать",
  "Золотой предмет на троне.",
  ()=>{
    if(inventory.includes("Королевская печать"))return say("Печать уже у тебя.");
    inventory.push("Королевская печать");updateInventory();
    say("Получена королевская печать.");
  }
);

const runePoints=[[65,1.3,158],[65,1.3,151],[59,1.3,158]];
runePoints.forEach((p,i)=>{
  addObject(...p,"Древний символ","На камне видны незнакомые знаки.",()=>{
    if(runeCount<=i){
      runeCount++;
      inventory.push("Рунический знак "+runeCount);
      updateInventory();
      say("Символ отозвался слабым сиянием.");
    }else say("Этот знак уже активирован.");
  });
});

// Древние ворота
const gate=box(65,0,143,5,5,.6,mats.iron,true);
addObject(65,1.5,140,"Осмотреть ворота",
  "На воротах вырезаны три пустых символа.",
  ()=>{
    if(runeCount<3)return say("Ворота не реагируют. Не хватает трёх символов.");
    if(gateOpen)return say("Ворота уже открыты.");
    gate.visible=false;
    gateOpen=true;
    say("Механизм сработал. Ворота открылись.");
  }
);

/* ===== КОЛЛИЗИИ ===== */

function blocked(x,z){
  for(const c of colliders){
    if(Math.abs(x-c.x)<c.w/2+.3 &&
       Math.abs(z-c.z)<c.d/2+.3)return true;
  }
  return false;
}
function move(dx,dz){
  const nx=player.x+dx;
  const nz=player.z+dz;
  if(!blocked(nx,player.z))player.x=nx;
  if(!blocked(player.x,nz))player.z=nz;
}

/* ===== СООБЩЕНИЯ И ИНВЕНТАРЬ ===== */

function say(text){
  const el=document.getElementById("message");
  el.textContent=text;
  el.style.display="block";
  messageTime=4;
}
function updateInventory(){
  document.getElementById("items").innerHTML=
    inventory.length?inventory.map(v=>"✦ "+v).join("<br><br>"):"Пока пусто.";
}
function interact(){
  if(nearby)nearby.callback();
  else say("Поблизости ничего интересного.");
}

/* ===== КАРТА ===== */

const mapCanvas=document.getElementById("mapCanvas");
const ctx=mapCanvas.getContext("2d");
const CELL=5;
const RANGE=170;

function reveal(){
  const gx=Math.floor((player.x+RANGE)/CELL);
  const gz=Math.floor((player.z+RANGE)/CELL);
  for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++){
    if(x*x+z*z<=13)discovered.add((gx+x)+","+(gz+z));
  }
}

function mapPoint(x,z){
  return {
    x:(x+RANGE)/(RANGE*2)*480,
    y:(z+RANGE)/(RANGE*2)*480
  };
}

function drawMap(){
  ctx.fillStyle="#283a36";
  ctx.fillRect(0,0,480,480);

  // Сначала известные области
  for(const key of discovered){
    const [gx,gz]=key.split(",").map(Number);
    const x=(gx*CELL-RANGE)/(RANGE*2)*480;
    const y=(gz*CELL-RANGE)/(RANGE*2)*480;
    ctx.fillStyle="#a99a76";
    ctx.fillRect(x,y,8,8);
  }

  // Маркер игрока
  const p=mapPoint(player.x,player.z);
  ctx.fillStyle="#f2d38a";
  ctx.beginPath();
  ctx.arc(p.x,p.y,6,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.stroke();
}

document.getElementById("mapButton").onclick=()=>{
  document.getElementById("mapPanel").style.display="block";
  mapVisible=true;drawMap();
};
document.getElementById("closeMap").onclick=()=>{
  document.getElementById("mapPanel").style.display="none";
  mapVisible=false;
};
document.getElementById("bagButton").onclick=()=>{
  document.getElementById("bagPanel").style.display="block";
};
document.getElementById("closeBag").onclick=()=>{
  document.getElementById("bagPanel").style.display="none";
};

/* ===== СОХРАНЕНИЕ ===== */

function save(){
  try{
    localStorage.setItem("forgottenKingdomSave",JSON.stringify({
      x:player.x,z:player.z,inventory,
      discovered:[...discovered],runeCount,gateOpen
    }));
  }catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem("forgottenKingdomSave")||"null");
    if(!d)return;
    player.x=d.x??0;player.z=d.z??24;
    if(Array.isArray(d.inventory))inventory.push(...d.inventory);
    if(Array.isArray(d.discovered))d.discovered.forEach(v=>discovered.add(v));
    runeCount=d.runeCount||0;
    gateOpen=!!d.gateOpen;
    if(gateOpen)gate.visible=false;
    updateInventory();
  }catch(e){}
}
load();

/* ===== УПРАВЛЕНИЕ ===== */

const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyE"||e.code==="Enter")interact();
  if(e.code==="Space"&&grounded){
    vy=6.5;grounded=false;
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

let lookId=null,lastX=0,lastY=0;
const lookArea=document.getElementById("lookArea");
lookArea.addEventListener("pointerdown",e=>{
  lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
  lookArea.setPointerCapture(e.pointerId);
});
lookArea.addEventListener("pointermove",e=>{
  if(e.pointerId!==lookId)return;
  yaw-=(e.clientX-lastX)*.005;
  pitch-=(e.clientY-lastY)*.004;
  pitch=THREE.MathUtils.clamp(pitch,-1.25,1.25);
  lastX=e.clientX;lastY=e.clientY;
});
lookArea.addEventListener("pointerup",()=>lookId=null);
lookArea.addEventListener("pointercancel",()=>lookId=null);

// Джойстик
const stick=document.getElementById("stick");
const nub=document.getElementById("nub");
let stickId=null;

stick.addEventListener("pointerdown",e=>{
  stickId=e.pointerId;
  stick.setPointerCapture(e.pointerId);
  updateStick(e);
});
stick.addEventListener("pointermove",e=>{
  if(e.pointerId===stickId)updateStick(e);
});
function updateStick(e){
  const r=stick.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2);
  let dy=e.clientY-(r.top+r.height/2);
  const len=Math.hypot(dx,dy),max=38;
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joystickX=dx/max;joystickY=dy/max;
  nub.style.left=(34+dx)+"px";
  nub.style.top=(34+dy)+"px";
}
function resetStick(){
  stickId=null;joystickX=0;joystickY=0;
  nub.style.left="34px";nub.style.top="34px";
}
stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

document.getElementById("jump").addEventListener("pointerdown",()=>{
  if(grounded){vy=6.5;grounded=false;}
});
const runButton=document.getElementById("run");
runButton.addEventListener("pointerdown",()=>running=true);
runButton.addEventListener("pointerup",()=>running=false);
runButton.addEventListener("pointercancel",()=>running=false);
runButton.addEventListener("pointerleave",()=>running=false);
document.getElementById("act").addEventListener("click",interact);

/* ===== ИГРОВОЙ ЦИКЛ ===== */

let saveTimer=0,frame=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.04);

  const f=(keys.KeyW||keys.ArrowUp?1:0)-
          (keys.KeyS||keys.ArrowDown?1:0)-joystickY;
  const s=(keys.KeyD||keys.ArrowRight?1:0)-
          (keys.KeyA||keys.ArrowLeft?1:0)+joystickX;
  const len=Math.hypot(f,s);

  if(len>.05){
    const speed=(running||keys.ShiftLeft||keys.ShiftRight)?8:4.3;
    const forward=f/Math.max(1,len);
    const side=s/Math.max(1,len);
    const dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*speed*dt;
    const dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*speed*dt;
    move(dx,dz);
  }

  if(!grounded){
    vy-=16*dt;
    player.y+=vy*dt;
    if(player.y<=1.7){
      player.y=1.7;vy=0;grounded=true;
    }
  }

  camera.position.set(player.x,player.y,player.z);
  camera.rotation.set(pitch,yaw,0,"YXZ");

  nearby=null;
  let best=3.2;
  for(const item of interactables){
    item.group.rotation.y+=dt*.5;
    const d=Math.hypot(
      player.x-item.group.position.x,
      player.z-item.group.position.z
    );
    if(d<best){best=d;nearby=item;}
  }

  const hint=document.getElementById("hint");
  if(nearby){
    hint.style.display="block";
    hint.innerHTML="<b>"+nearby.name+"</b><br>"+nearby.description+"<br><br>НАЖМИ ДЕЙСТВИЕ";
  }else hint.style.display="none";

  reveal();

  if(messageTime>0){
    messageTime-=dt;
    if(messageTime<=0)document.getElementById("message").style.display="none";
  }

  if(frame++%25===0){
    let name="ROYAL COURTYARD";
    if(player.z<-2&&player.z>-43)name="THE ROYAL CASTLE";
    else if(player.z>40&&player.z<100)name="THE OLD TOWN";
    else if(player.z>=100&&player.x<30)name="THE WHISPERING WOODS";
    else if(player.z>100&&player.x>30)name="THE SILENT LAKE";
    else if(player.x>48&&player.z>140)name="THE FORGOTTEN RUINS";
    document.getElementById("location").textContent=name;
  }

  saveTimer+=dt;
  if(saveTimer>10){save();saveTimer=0;}

  renderer.render(scene,camera);
}

updateInventory();
reveal();
say("Путешествие начинается.");
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
addEventListener("beforeunload",save);
</script>
</body>
</html>
